repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: no-dgp-artifacts
        name: block DGP artifacts
        entry: bash -c 'git diff --cached --name-only | grep -E "(^|/)(biokraft-dgp|dgp)/" && { echo "DGP artifacts must not enter this repo (IDEATION §11)"; exit 1; } || exit 0'
        language: system
        pass_filenames: false
