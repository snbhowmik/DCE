[project]
name = "biokraft-dce"
version = "0.0.1"
description = "Biokraft Demand-Capacity Engine"
requires-python = ">=3.11,<3.13"
dependencies = [
    "polars>=1.0",
    "pandas>=2.2",
    "pyarrow>=16",
    "pandera[polars]>=0.20",
    "jsonschema>=4.22",
    "duckdb>=1.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "structlog>=24.1",
    "sqlmodel>=0.0.21",
    "typer>=0.12",
    "numpy>=1.26",
]

[project.scripts]
dce = "dce.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "import-linter>=2.0",
    "types-PyYAML",
    "pandas-stubs",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dce"]

[tool.pytest.ini_options]
testpaths = ["dce/tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # allow ₹, ×, – in strings/comments

[tool.ruff.lint.per-file-ignores]
"dce/tests/*" = ["E501"]  # inline fixture tables

[tool.mypy]
python_version = "3.12"
packages = ["dce"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
