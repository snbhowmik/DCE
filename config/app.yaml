# Global application settings (ARCH §8).
seed: 20260929
horizon_weeks: 13
horizon_months: 3
n_paths: 500
week_start: monday
currency: INR
unit: kg
paths:
  incoming: data/incoming
  fixtures: data/fixtures
  processed: data/processed
  reports: reports
  db: data/processed/dce.sqlite
llm:
  provider: anthropic
  model: claude-sonnet-5
  timeout_s: 60
  max_retries: 2
forecast:
  quantiles: [0.1, 0.5, 0.9]
  backtest:
    n_folds: 6
    step_weeks: 4
    min_train_weeks: 52
  mase_seasonality: 52
capacity:
  failure_prior: [1.0, 1.0]     # Beta(a, b) prior on per-batch failure probability
  history_weeks: 104            # batches used for yield/failure estimates (most recent)
  plan_alignment: auto          # auto | start | end: capacity_plan week = batch start or output week
  coman_reliability_prior: [9.0, 1.0]   # Beta prior on delivered/requested when no activity
  carryover_cap_weeks: 1        # A-003: carryover ≤ 1 week by default
  waste_cost_inr_per_kg: null   # null → unit production cost
