# Mitigation catalog (IDEATION §10, ARCH §5.9, T6.2). Each entry maps to what-if levers that the
# engine re-solves and stress-tests (dce.mitigate). lead_time_weeks gates feasibility; harm is a
# 0–1 judgement of non-cash damage (goodwill, relationships). Initial values; tune only via TN entries.
harm_weight_inr: 200000         # ₹ equivalent of harm = 1.0 in the ranking score
breach:
  - id: M1
    name: D2C waitlist / pre-order
    lead_time_weeks: 0
    reversible: "yes"
    harm: 0.3
    effect: defers 20% of D2C demand from the alert week
    levers: {d2c_demand_pct: -20, from: alert}
  - id: M2
    name: Spend throttle / reallocation
    lead_time_weeks: 2
    reversible: "yes"
    harm: 0.4
    effect: cuts marketing budget 40% (demand responds only where spend response is identified)
    levers: {budget_pct: -40}
  - id: M3
    name: Co-man activation
    lead_time_weeks: partner      # the partner's contract lead time
    reversible: partly (minimum commitments)
    harm: 0.1
    effect: already optimized inside every plan (activation, volume, lead time)
    levers: null
  - id: M4
    name: B2B onboarding deferral / phased ramp
    lead_time_weeks: 0
    reversible: "yes"
    harm: 0.5
    effect: see the onboarding simulator; applies when a new account is pending
    levers: null
  - id: M5
    name: Delivery-slot / promise-date spreading
    lead_time_weeks: 0
    reversible: "yes"
    harm: 0.2
    effect: moves 10% of D2C demand out of the alert weeks (within shelf life)
    levers: {d2c_demand_pct: -10, from: alert}
  - id: M6
    name: Contract-aware rebalancing
    lead_time_weeks: 0
    reversible: "yes"
    harm: 0.6
    effect: lowers the B2B service floor to 85% so partial fills go to the lowest-penalty contracts
    levers: {mode: CUSTOM, mode_overrides: {b2b_service_floor: 0.85}}
surplus:
  - id: S1
    name: Raise spend in high-evidence regions
    lead_time_weeks: 2
    reversible: "yes"
    harm: 0.1
    effect: marketing budget +30% (demand responds only where spend response is identified)
    levers: {budget_pct: 30}
  - id: S2
    name: Trim co-manufacturing
    lead_time_weeks: 0
    reversible: partly (minimum commitments)
    harm: 0.1
    effect: removes co-man from the plan
    levers: {coman_available: false}
  - id: S3
    name: D2C promotion / pull-forward
    lead_time_weeks: 1
    reversible: "yes"
    harm: 0.2
    effect: lifts D2C demand 15% from the alert week (price promotion, margin cost)
    levers: {d2c_demand_pct: 15, from: alert}
