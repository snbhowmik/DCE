# Biokraft DCE: dashboard + API on one origin, port 80.
# Optional password: sudo htpasswd -B /etc/nginx/dce.htpasswd judge  → then uncomment auth_basic.
limit_req_zone $binary_remote_addr zone=dce_heavy:10m rate=12r/m;   # what-ifs + re-runs

server {
    listen 80 default_server;
    server_name _;
    client_max_body_size 1m;
    # auth_basic "Biokraft DCE";
    # auth_basic_user_file /etc/nginx/dce.htpasswd;

    location ~ ^/api/v1/(scenarios|runs)$ {
        limit_req zone=dce_heavy burst=6 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_read_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_read_timeout 120s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
